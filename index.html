<style>
  :root{
    --accent:#1D2060;          /* navy, taken from reference. Change here if the final accent differs */
    --accent-ink:#fff; --hl:#1D2060; --onhl:#fff;
    --ink:#171A3A; --muted:#8A8FA8; --line:#E8E9F2;
    --live:#F0444B; --tint:#EEEFFB;
    --card:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box;margin:0}
  html{background:#fff}
  body{font:14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;
       background:linear-gradient(180deg,#F9E3EA 0,#F1EBF8 230px,#fff 460px) no-repeat;
       padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  header.top{position:sticky;top:-94px;z-index:30;overflow:hidden;color:#fff;border-radius:0 0 26px 26px;
    background:radial-gradient(280px 170px at 100% 0%,rgba(255,120,160,.5),transparent 70%),
               linear-gradient(135deg,#1D2060 0%,#2A2F8E 58%,#4439B4 100%);
    box-shadow:0 10px 28px rgba(29,32,96,.28)}
  .pitch{position:absolute;right:-24px;top:-6px;width:310px;pointer-events:none}
  .hin{position:relative;max-width:720px;margin:0 auto;padding:0 20px}
  .hide{height:94px;padding-top:18px}   /* scrolls away; the part below stays fixed */
  .keep{padding:8px 0 14px}
  .toprow{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);font-weight:800;font-size:11px;display:grid;place-items:center}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;opacity:.85}
  .meta3{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .meta3 span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:12px;line-height:1.2}
  .meta3 b{font-weight:800}
  .tline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header.top h1{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.6px}
  header.top h1 em{font-style:normal;background:linear-gradient(90deg,#FFB3C7,#FFE1A8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .livechip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);
    color:#fff;border-radius:99px;padding:5px 12px;font:700 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
  .livechip i{width:7px;height:7px;border-radius:50%;background:#FF5A66;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,102,.7)}70%{box-shadow:0 0 0 7px rgba(255,90,102,0)}100%{box-shadow:0 0 0 0 rgba(255,90,102,0)}}
  @media (prefers-reduced-motion:reduce){.livechip i{animation:none}}
  .prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
  .prog span{white-space:nowrap;opacity:.92}
  .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB3C7,#FFE1A8)}
  main{padding:16px 16px 12px;max-width:720px;margin:0 auto}
  h2{font-size:18px;font-weight:800;margin:20px 2px 10px}
  .card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #fff;
        border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px rgba(29,32,96,.08)}
  /* match card */
  .mtop{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:12px}
  .mmid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
  .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
  .side b{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crest{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent);
         border:2px solid var(--tint);font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 4px 12px rgba(29,32,96,.10)}
  .crest.tbd{color:var(--muted);background:var(--tint);box-shadow:none}
  .center{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:104px;text-align:center}
  .score{font-size:30px;font-weight:800;letter-spacing:1px}
  .when{font-size:12px;color:var(--muted);font-weight:500}
  .time{font-size:21px;font-weight:800;color:var(--accent)}
  .sub{font-size:11px;color:var(--muted)}
  .hero{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(246,240,250,.85))}
  .hero .score{font-size:40px} .hero .crest{width:62px;height:62px;font-size:17px}
  .pen{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
  .pill.live{background:var(--live);color:#fff}
  .badge{display:inline-grid;place-items:center;min-width:38px;height:24px;padding:0 7px;border-radius:99px;
         background:var(--accent);color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px}
  .badge.tbd{background:var(--tint);color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 4px;text-align:center} th{color:var(--muted);font-weight:600;font-size:12px}
  td:nth-child(2),th:nth-child(2){text-align:left}
  tr.adv td{background:var(--tint)} tr.adv td:first-child{border-radius:10px 0 0 10px} tr.adv td:last-child{border-radius:0 10px 10px 0}
  input,select{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.9);color:var(--ink)}
  input[type=checkbox]{padding:0}
  button.btn{font:inherit;font-weight:700;padding:11px 20px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
  button.btn:disabled{opacity:.45}
  button.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .scoreinput{width:60px;text-align:center;font-weight:800;font-size:17px;padding:8px 4px}
  .muted{color:var(--muted)} .err{color:var(--live)} .empty{padding:32px 12px;text-align:center;color:var(--muted)}
  .num{font-weight:800}
  /* bottom navigation */
  nav{position:fixed;left:12px;right:12px;max-width:696px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));
      display:flex;background:#fff;border-radius:30px;padding:10px 6px;box-shadow:0 12px 32px rgba(29,32,96,.18)}
  nav button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;
             font:600 10px 'Plus Jakarta Sans';padding:0;height:54px;justify-content:center}
  nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  nav button.on .ic{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(29,32,96,.3);border:0}
                    transform:translateY(-14px);margin-bottom:-14px;box-shadow:0 8px 16px rgba(29,32,96,.35);border:4px solid #fff}
  nav button.on svg{stroke:#fff;width:21px;height:21px}
  nav button.on .lb{display:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* teams, team page, match page */
  .mc{cursor:pointer}
  .back{margin:4px 0 12px;padding:8px 16px}
  .thead{display:flex;align-items:center;gap:14px;margin:4px 2px 14px}
  .tcode{font-family:var(--cond,inherit);font-style:var(--cstyle,normal);font-weight:800;font-size:48px;line-height:1;letter-spacing:1px}
  .tn{font-weight:700;font-size:16px} .ts{color:var(--muted);font-size:12px;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
  .stat .v{font-weight:800;font-size:24px;line-height:1.1;font-family:var(--cond,inherit);font-style:var(--cstyle,normal)}
  .stat .k{font-size:11px;color:var(--muted)}
  .stat.wide{grid-column:span 4;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;text-align:left}
  .stat.wide .v{font-size:18px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .prow.first{border-top:0}
  .pname{display:flex;align-items:center}
  .cap{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--hl);color:var(--onhl);font-size:10px;font-weight:800;margin-left:8px}
  .mob{color:var(--hl);font-weight:600;text-decoration:none;white-space:nowrap}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .kv.first{border-top:0} .kv span{color:var(--muted)} .kv b{text-align:right}
  .lhead{display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer}
  .k{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 0}
  .trow{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .trow b{flex:1;font-weight:600}
  .gl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .gl.first{border-top:0} .gl .min{width:34px;color:var(--muted)}
  .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px}
  .chk input{padding:0}
  .note{font-size:12px;color:var(--muted);margin:6px 2px 12px}
  .rhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .rnum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .rhead b{font-size:15px}
  .rlist{padding-left:20px} .rlist li{margin:6px 0}
  .rfoot{text-align:center;font-weight:800;letter-spacing:.8px;margin:18px 0 4px;color:var(--accent)}
  .wcard{background:linear-gradient(135deg,#FFE3EC,#EDE6FB)}
  .wtop{display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .wsub{font-size:13px;color:var(--muted);margin-top:3px} .wsub.strong{color:var(--accent);font-weight:700;margin-top:8px}
  .ic2{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
  .ic2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cardic{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .cardic.y{background:#F5C400} .cardic.r{background:#E5252A}
  /* ===== Rush layer: arena look (angled shapes, scoreboard digits, neon accents) ===== */
  :root{--cond:'Barlow Condensed',sans-serif;--cstyle:italic;--cyan:#00D4FF;--mag:#FF2E93;--neon:#C6FF00}
  body{background:repeating-linear-gradient(115deg,rgba(29,32,96,.03) 0 2px,transparent 2px 30px),
       linear-gradient(180deg,#F9E3EA 0,#F1EBF8 230px,#fff 460px) no-repeat}
  /* header */
  header.top{clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 34px) 100%,0 100%);border-radius:0;box-shadow:none;padding-bottom:6px}
  header.top::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 26px)}
  header.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--neon) 55%,var(--mag))}
  .hin{z-index:1}
  header.top h1{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;font-size:42px;line-height:1;letter-spacing:.6px}
  header.top h1 em{background:linear-gradient(90deg,var(--cyan),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kicker{font-family:var(--cond);font-style:italic;font-size:14px;letter-spacing:1.4px}
  .meta3 span{border-radius:3px;transform:skewX(-12deg);font-family:var(--cond);font-style:italic;font-weight:600;font-size:14px;letter-spacing:.4px;background:rgba(0,0,0,.22);border-color:rgba(0,212,255,.4)}
  .meta3 b{color:var(--neon)}
  .bar{height:8px;border-radius:2px;transform:skewX(-20deg);background:rgba(0,0,0,.28)}
  .bar i{border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--neon))}
  .prog span{font-family:var(--cond);font-style:italic;font-size:14px;letter-spacing:.4px}
  .livechip{border-radius:3px;background:rgba(255,46,147,.2);border-color:var(--mag);font-family:var(--cond);font-style:italic;font-size:15px;letter-spacing:.5px;box-shadow:0 0 14px rgba(255,46,147,.5)}
  /* headings */
  h2{font-family:var(--cond);font-style:italic;font-weight:800;text-transform:uppercase;font-size:25px;letter-spacing:.6px;display:flex;align-items:center;gap:10px}
  h2::before{content:'';flex:none;width:8px;height:22px;transform:skewX(-20deg);background:linear-gradient(180deg,var(--cyan),var(--mag))}
  /* cards */
  .card{border-radius:6px 22px 6px 22px}
  .card.mc{position:relative}
  .card.mc::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:linear-gradient(var(--cyan),var(--mag))}
  .crest{width:58px;height:64px;border-radius:0;border:0;box-shadow:none;color:#fff;font-family:var(--cond);font-style:italic;font-weight:800;font-size:20px;letter-spacing:1px;
    clip-path:polygon(50% 0,100% 16%,100% 72%,50% 100%,0 72%,0 16%);background:linear-gradient(160deg,#1D2060,#4439B4)}
  .crest.tbd{background:#DADCEB;color:#7B7FA0}
  .hero .crest{width:66px;height:72px;font-size:22px}
  .side b{text-transform:uppercase;letter-spacing:.2px;font-size:11.5px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .score{font-family:var(--cond);font-style:italic;font-weight:800;font-size:38px;line-height:1.1;letter-spacing:2px;color:var(--neon);
    background:linear-gradient(180deg,#171D5E,#0B0F36);padding:0 18px;border-radius:5px;transform:skewX(-10deg);
    box-shadow:0 0 0 1px rgba(0,212,255,.45),0 6px 14px rgba(11,15,54,.35)}
  .hero .score{font-size:50px}
  .hero{box-shadow:0 0 0 1px rgba(0,212,255,.55),0 12px 30px rgba(0,212,255,.22)}
  .time{font-family:var(--cond);font-style:italic;font-weight:800;font-size:28px;line-height:1.1}
  .when{text-transform:uppercase;letter-spacing:.5px;font-size:11px}
  .pill.live{background:#FF2E5B;color:#fff;box-shadow:0 0 12px rgba(255,46,91,.6)}
  .mtop{text-transform:uppercase;letter-spacing:.6px;font-size:11px}
  /* tables, stats, tags */
  th{font-family:var(--cond);font-style:italic;text-transform:uppercase;letter-spacing:.6px;font-size:13px}
  td b{font-family:var(--cond);font-style:italic;font-size:20px}
  tr.adv td:first-child{box-shadow:inset 4px 0 0 var(--cyan)}
  .badge{border-radius:3px;font-family:var(--cond);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.8px}
  .stat{border-radius:4px 16px 4px 16px;border-top:3px solid var(--cyan)}
  .tcode{font-size:58px;background:linear-gradient(90deg,#1D2060,#5A45D6);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:6px}
  .rnum{border-radius:4px;transform:skewX(-12deg);font-family:var(--cond);font-style:italic;font-size:15px}
  /* buttons */
  button.btn{border-radius:0;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);padding:11px 28px;font-family:var(--cond);font-style:italic;font-weight:800;font-size:16px;letter-spacing:.8px;text-transform:uppercase}
  button.btn.ghost{border:0;background:#E7E9F8;color:var(--accent)}
  nav button.on .ic{box-shadow:0 6px 14px rgba(29,32,96,.3),0 0 0 3px rgba(0,212,255,.6)}
  /* live, insights, stats */
  .livehead{color:#D4143F}
  .livehead::before{width:12px;height:12px;border-radius:50%;transform:none;background:#FF2E5B;animation:pulse2 1.4s infinite}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,46,91,.6)}70%{box-shadow:0 0 0 9px rgba(255,46,91,0)}100%{box-shadow:0 0 0 0 rgba(255,46,91,0)}}
  @media (prefers-reduced-motion:reduce){.livehead::before{animation:none}}
  .card.livecard{background:linear-gradient(135deg,#1B0A3A 0%,#4A0F52 55%,#8A1046 100%);color:#fff;border:1px solid #FF2E93;
    box-shadow:0 0 0 1px rgba(255,46,147,.5),0 12px 30px rgba(255,46,91,.3)}
  .livecard .mtop,.livecard .sub,.livecard .when,.livecard .pen{color:rgba(255,255,255,.75)}
  .livecard .side b{color:#fff}
  .livecard .crest{background:linear-gradient(160deg,#fff,#E7E1FF);color:#1D2060}
  .livecard .score{box-shadow:0 0 0 1px rgba(198,255,0,.7),0 0 22px rgba(198,255,0,.35)}
  .livecard.mc::before{background:linear-gradient(#FF2E5B,#FF9A3C)}
  .insights{margin-top:10px;padding-top:9px;border-top:1px dashed rgba(29,32,96,.22);display:grid;gap:7px}
  .ins{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;line-height:1.3}
  .ins.hot{font-weight:700} .ins.ko{color:var(--muted);font-weight:600}
  .dod{background:#FF2E5B;color:#fff;font:italic 800 12px var(--cond);letter-spacing:.8px;padding:2px 8px;border-radius:2px;transform:skewX(-12deg);text-transform:uppercase;flex:none}
  .h2h-row{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;text-align:center;padding:8px 0;border-top:1px solid var(--line)}
  .h2h-row.first{border-top:0} .h2h-row b{font-family:var(--cond);font-style:italic;font-size:18px}
  .h2h-row span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .fm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:3px;font:italic 800 12px var(--cond);color:#fff;margin:0 2px}
  .fm.W{background:#12805C} .fm.D{background:#8B8FA8} .fm.L{background:#E5252A}
  .h2h-row .fm{color:#fff;font-size:12px;letter-spacing:0;text-transform:none}
  .center .pill.live{margin-bottom:12px}
  .pname{flex-wrap:wrap;gap:4px 0}
  .rtag{margin-left:8px;padding:1px 8px;border-radius:2px;transform:skewX(-10deg);font-family:var(--cond);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;background:#E7E9F8;color:#1D2060}
  .rtag.att{background:#FFE0EA;color:#B0123F} .rtag.mid{background:#DDF4FF;color:#00698C} .rtag.def{background:#E3F6EA;color:#12664A}
</style>
</head>

<script src="config.js"></script>
<script>
const CFG = window.RSF_CONFIG || {};
const SUPABASE_URL = CFG.url || 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = CFG.key || 'YOUR-ANON-KEY';
const GROUND_OPTIONS = ['Ground 1', 'Ground 2', 'Ground 3'];
const TOTAL_MATCHES = 80;
const BEST_OF = {
  SF: 1,
  F: 1
};
const ADVANCE_PER_GROUP = 2;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const {
  useState,
  useEffect,
  useMemo,
  useCallback,
  useContext
} = React;
const Ctx = React.createContext({});
const GROUP_LETTERS = 'ABCDEFGHIJKLMNOP'.split('');
const ROUND_LABEL = {
  WG: "Women's group",
  WF: "Women's final",
